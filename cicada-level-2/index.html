<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CICADA-0 | Level 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff00;
            padding: 40px;
            border-radius: 8px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .morse-code {
            font-size: 18px;
            letter-spacing: 3px;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 4px;
            word-break: break-all;
            line-height: 1.6;
        }
        
        button {
            background: #00ff00;
            color: #0a0e27;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin: 20px 0;
        }
        
        button:hover {
            background: #00dd00;
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #00ff0088;
        }
        
        .prompt {
            margin: 30px 0 20px 0;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #1a1f3a;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        
        input::placeholder {
            color: #00ff0055;
        }
        
        .verify-button {
            background: #00ff00;
            color: #0a0e27;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .verify-button:hover {
            background: #00dd00;
            transform: scale(1.05);
        }
        
        .hidden-content {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #00ff00;
        }
        
        .hidden-content.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .next-link {
            margin-top: 20px;
            display: inline-block;
            padding: 12px 20px;
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .next-link:hover {
            background: rgba(0, 255, 0, 0.4);
            text-decoration: underline;
        }
        
        .error {
            color: #ff0000;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙ LEVEL 2</h1>
        
        <div class="morse-code" id="morseDisplay">
            .--. .- ... ... .-- --- .-. -.. ---... / .. - ... -....- ...- . .-. -.-- -....- ...- . .-. -.-- -....- ... . -.-. .-. . -
        </div>
        
        <button onclick="playMorse()">▶ PLAY MORSE</button>
        
        <div class="status" id="status"></div>
        
        <div class="prompt" style="margin-top: 30px; color: #00ff0088; font-size: 12px;">💡 Hint: Morse code translates to a password. Decrypt it and enter below.</div>
        
        <div class="prompt">Enter the password:</div>
        <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off">
        <button class="verify-button" onclick="checkPassword()">VERIFY</button>
        
        <div class="error" id="error">Incorrect password</div>
        
        <div class="hidden-content" id="hiddenContent">
            <h2>ACCESS GRANTED</h2>
            <a href="https://san5ezez.github.io/cicada-level-3" class="next-link">→ NEXT COMPARTMENT</a>
        </div>
    </div>
    
    <script>
        let audioContext = null;
        let currentOscillator = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playMorse() {
            initAudio();
            document.getElementById('status').textContent = 'Playing...';
            
            const morseCode = '.--. .- ... ... .-- --- .-. -.. ---... / .. - ... -....- ...- . .-. -.-- -....- ...- . .-. -.-- -....- ... . -.-. .-. . -';
            
            const dotDuration = 150;      // точка
            const dashDuration = 450;     // тире
            const gapDuration = 150;      // пауза между символами
            const letterGapDuration = 350; // пауза между буквами
            const wordGapDuration = 700;   // пауза между словами
            
            let totalTime = 0;
            const events = [];
            
            // Парсим морзе и создаём события
            for (let char of morseCode) {
                if (char === '.') {
                    events.push({ type: 'beep', time: totalTime, duration: dotDuration });
                    totalTime += dotDuration + gapDuration;
                } else if (char === '-') {
                    events.push({ type: 'beep', time: totalTime, duration: dashDuration });
                    totalTime += dashDuration + gapDuration;
                } else if (char === ' ') {
                    totalTime += letterGapDuration;
                } else if (char === '/') {
                    totalTime += wordGapDuration;
                }
            }
            
            // Воспроизводим все события
            const startTime = audioContext.currentTime + 0.1;
            
            for (let event of events) {
                const eventTime = startTime + event.time / 1000;
                playBeepAt(eventTime, event.duration);
            }
            
            // Обновляем статус после окончания
            setTimeout(() => {
                document.getElementById('status').textContent = 'Done!';
                setTimeout(() => {
                    document.getElementById('status').textContent = '';
                }, 1000);
            }, totalTime + 100);
        }
        
        function playBeepAt(startTime, duration) {
            const frequency = 700;
            const volume = 0.6;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.frequency.value = frequency;
            osc.type = 'sine';
            
            // Мягкое включение и выключение
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
            gain.gain.linearRampToValueAtTime(0, startTime + duration / 1000 - 0.01);
            
            osc.start(startTime);
            osc.stop(startTime + duration / 1000);
        }
        
        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim();
            const correctPassword = 'PASSWORD';
            const errorElement = document.getElementById('error');
            const hiddenContent = document.getElementById('hiddenContent');
            
            if (input === correctPassword) {
                errorElement.style.display = 'none';
                hiddenContent.classList.add('show');
            } else {
                errorElement.style.display = 'block';
                hiddenContent.classList.remove('show');
            }
        }
        
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>

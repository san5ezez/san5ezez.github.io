<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CICADA-0 | Level 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff00;
            padding: 40px;
            border-radius: 8px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .prompt {
            margin: 20px 0;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #1a1f3a;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        
        input::placeholder {
            color: #00ff0055;
        }
        
        button {
            background: #00ff00;
            color: #0a0e27;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #00dd00;
            transform: scale(1.05);
        }
        
        .hidden-content {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #00ff00;
            text-align: left;
        }
        
        .hidden-content.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .next-link {
            margin-top: 20px;
            display: inline-block;
            padding: 12px 20px;
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .next-link:hover {
            background: rgba(0, 255, 0, 0.4);
            text-decoration: underline;
        }
        
        .error {
            color: #ff0000;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙ LEVEL 3</h1>
        <p class="prompt">Enter the password to proceed:</p>
        
        <div style="margin: 20px 0; padding: 15px; background: rgba(0, 255, 0, 0.05); border: 1px dashed #00ff0055; border-radius: 4px; font-size: 12px; color: #00ff0088;">
            💡 Hint: The password is related to the previous level. Think about what you decrypted...
        </div>
        
        <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off">
        <button onclick="checkPassword()">VERIFY</button>
        
        <div class="error" id="error">Incorrect password</div>
        
        <div class="hidden-content" id="hiddenContent">
            <h2>ACCESS GRANTED</h2>
            <a href="https://san5ezez.github.io/cicada-level-4" class="next-link">→ FINAL COMPARTMENT</a>
        </div>
    </div>
    
    <script>
        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim();
            const correctPassword = 'byxapnk';
            const errorElement = document.getElementById('error');
            const hiddenContent = document.getElementById('hiddenContent');
            
            if (input === correctPassword) {
                errorElement.style.display = 'none';
                hiddenContent.classList.add('show');
            } else {
                errorElement.style.display = 'block';
                hiddenContent.classList.remove('show');
            }
        }
        
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CICADA-0 | Final</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff00;
            padding: 40px;
            border-radius: 8px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .prompt {
            margin: 20px 0;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #1a1f3a;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        
        input::placeholder {
            color: #00ff0055;
        }
        
        button {
            background: #00ff00;
            color: #0a0e27;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #00dd00;
            transform: scale(1.05);
        }
        
        .hidden-content {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #00ff00;
            text-align: center;
        }
        
        .hidden-content.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .final-message {
            background: rgba(0, 255, 0, 0.1);
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
            text-align: left;
        }
        
        .code-section {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.3);
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            word-break: break-all;
            line-height: 1.6;
            font-size: 12px;
        }
        
        .copy-button {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            transition: all 0.3s;
        }
        
        .copy-button:hover {
            background: rgba(0, 255, 0, 0.3);
        }
        
        .error {
            color: #ff0000;
            margin-top: 10px;
            display: none;
        }
        
        .success {
            color: #00ff00;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙ FINAL COMPARTMENT</h1>
        
        <h2 style="margin-top: 30px;">★ CONGRATULATIONS ★</h2>
        
        <div class="final-message">
            <p>You have successfully decrypted.</p>
            <p style="margin-top: 15px;">Send this message to <strong>@boing_lover</strong> on Telegram:</p>
        </div>
        
        <div class="code-section" id="codeDisplay">
D0 AD D1 82 D0 B0 20 D0 B7 D0 B0 D0 B3 D0 B0 D0 B4 D0 BA D0 B0 20 D1 80 D0 B5 D1 88 D0 B5 D0 BD D0 B0 21 0A D0 AF 20 D0 B2 20 D1 88 D0 BE D0 BA D0 B5
        </div>
        
        <button class="copy-button" onclick="copyToClipboard()">📋 COPY CODE</button>
        
        <div class="success" id="success">Copied to clipboard!</div>
    </div>
    
    <script>
        function copyToClipboard() {
            const codeElement = document.getElementById('codeDisplay');
            const text = codeElement.textContent.trim();
            
            navigator.clipboard.writeText(text).then(() => {
                const successElement = document.getElementById('success');
                successElement.style.display = 'block';
                setTimeout(() => {
                    successElement.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
